AllCops:
  TargetRubyVersion: 3.1
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - "docs/**/*"
    - "tmp/**/*"
    - "vendor/**/*"
    - "spec/dummy/tmp/**/*"

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

Style/Documentation:
  Exclude:
    - "spec/**/*"

Layout/LineLength:
  Max: 120

# The engine's core methods read top to bottom on purpose; splitting them further hides the flow.
Metrics/MethodLength:
  Max: 30
Metrics/AbcSize:
  Max: 40
Metrics/CyclomaticComplexity:
  Max: 12
Metrics/PerceivedComplexity:
  Max: 12
Metrics/ClassLength:
  Max: 300
Metrics/ModuleLength:
  Max: 200
Metrics/ParameterLists:
  Max: 8
Metrics/BlockLength:
  Exclude:
    - "spec/**/*"
    - "*.gemspec"

# gemfiles/rails-X.Y.gemfile keep the Rails version in the name, as the CI matrix uses it.
Naming/FileName:
  Exclude:
    - "gemfiles/*.gemfile"
